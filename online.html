<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#163f35"><title>台灣麻將・朋友連線</title><link rel="stylesheet" href="online.css"><script defer src="online-config.js"></script><script defer src="tiles.js"></script><script defer src="online.js"></script></head><body>
<header><button id="menuOpen">選單</button><strong id="roomCode">朋友連線</strong><span class="stat">可摸牌<strong id="wall">—</strong></span><span class="stat coins">金幣<strong id="coins">—</strong></span></header>
<p id="connection" role="status">尚未連線</p>
<main><section id="lobby" class="panel"><h1>一起慢慢打麻將</h1><p>開一間房，邀請朋友輸入房號。至少兩人，空位由電腦補上，沒有出牌倒數。</p><label>你的暱稱<input id="nickname" maxlength="24" autocomplete="nickname" placeholder="最多12個字"></label><button id="create" class="primary">建立房間</button><label>六位數房號<input id="joinCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="輸入朋友的房號"></label><button id="join">加入房間</button><button id="resume" hidden>接續上次房間</button><p class="note">免費試玩版：伺服器休眠或更新後房間可能消失。聯機金幣獨立計算，不影響單機金幣、排行榜與牌位。</p><a href="https://sharkday27.github.io/taiwan-mahjong/">返回單機遊玩</a></section>
<section id="table" class="table" hidden><div id="players"></div><div id="waiting"><h2>等待朋友加入</h2><p>把上方房號告訴朋友。</p><button id="share">複製邀請連結</button><div id="lobbyActions"><button id="ready">準備</button><button id="start" class="primary">開始牌局</button></div></div><div id="river" aria-label="棄牌"></div></section>
<section id="dock" hidden><section id="claim" class="claim" aria-label="接牌選擇" hidden></section><div class="info"><div><p id="status" role="status"></p><p id="flowers"></p></div><button id="sort">理牌</button><button id="hint">選牌<br>建議</button></div><div id="melds" class="meldarea"></div><div class="play"><div id="hand" aria-label="手牌，可按住拖曳排序"></div><button id="discard" class="primary" disabled>先選一張牌</button></div><button id="resultOpen" hidden>查看結算</button></section>
</main><dialog id="menu"><h2>朋友連線</h2><p id="menuRoom"></p><button id="copyInvite">複製邀請連結</button><label>音量<input id="volume" type="range" min="0" max="100" step="5"></label><button id="font">大字</button><p class="note">斷線時暫停牌局，回到同一個瀏覽器即可重新連線。進行中的座位會保留；若有人長時間離開，可由其他玩家重新建立房間。</p><button id="leave">離開房間</button><a href="https://sharkday27.github.io/taiwan-mahjong/">返回單機</a><button id="menuClose" class="primary">返回牌局</button></dialog><dialog id="settlement"><h2 id="resultTitle"></h2><div id="resultBody"></div><button id="resultClose" class="primary">返回房間準備下一局</button></dialog><div id="toast" role="status" hidden></div>
</body></html>
